<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Leaderboard</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Roulette">
    <link rel="stylesheet" href="messenger.css">
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            if (!params.has("enter") && !params.has("chat")) location.replace("index.html");
        })();
    </script>
</head>
<body>
    <main class="app">
        <header class="top">
            <div class="brand">
                <p class="eyebrow">Challenges proposed</p>
                <h1>Leaderboard</h1>
            </div>
            <div class="who">
                <button id="notesBtn" class="ghost" type="button" hidden>Notes</button>
                <button id="notifyBtn" class="ghost" type="button" hidden>Notify me</button>
                <button id="logoutBtn" class="ghost" type="button" hidden>Log out</button>
            </div>
            <div class="under">
                <a href="index.html">Back to the game</a>
            </div>
        </header>
        <button id="seeAllBtn" type="button">See all challenges</button>

        <section id="auth">
            <form id="signupForm" class="card">
                <h2>Create an account</h2>
                <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="20"></label>
                <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
                <button type="submit">Sign up</button>
            </form>
            <form id="loginForm" class="card">
                <h2>Log in</h2>
                <label>Username<input name="username" autocomplete="username" required></label>
                <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
                <button type="submit">Log in</button>
            </form>
            <p id="authError" class="error" role="alert"></p>
        </section>

        <section id="chat" hidden>
            <p class="hint">Scores to beat</p>
            <ul id="contacts"></ul>
            <form id="addForm">
                <input id="contactInput" maxlength="20" placeholder="Username" autocomplete="off" tabindex="-1">
                <button type="submit">Add</button>
            </form>
            <button id="newGroup" type="button">New group</button>
            <p id="contactError" class="error" role="alert"></p>
        </section>
        <dialog id="chatPop">
            <div class="pop">
                <div class="pop-bar">
                    <button id="closePop" class="quiet" type="button" aria-label="Close">
                        <span class="back-mark" aria-hidden="true"></span>
                        <span class="close-word">Close</span>
                    </button>
                    <p id="threadTitle" class="hint">Chat</p>
                    <form id="groupInvite" hidden>
                        <input id="inviteUser" maxlength="20" placeholder="add user to chat" autocomplete="off">
                        <button type="submit">Add</button>
                    </form>
                </div>
                <p id="threadMembers" class="thread-members" hidden></p>
                <div id="groupTools" class="group-tools" hidden>
                    <button id="leaveGroup" class="quiet" type="button" hidden>Leave</button>
                </div>
                <ol id="messages"></ol>
                <p id="typingLine" class="typing-line" hidden></p>
                <form id="sendForm" hidden>
                    <div id="replyBar" class="reply-bar" hidden>
                        <div class="reply-copy">
                            <p id="replyName"></p>
                            <p id="replyText"></p>
                        </div>
                        <button id="replyClear" type="button" aria-label="Cancel reply">×</button>
                    </div>
                    <div id="voiceDraft" class="reply-bar" hidden>
                        <div class="reply-copy">
                            <p>Voice note</p>
                            <p id="voiceDraftTime"></p>
                        </div>
                        <button id="voiceClear" type="button">Remove</button>
                    </div>
                    <div class="compose-line">
                        <textarea id="messageInput" maxlength="500" rows="3" placeholder="Message (optional)" autocomplete="off"></textarea>
                        <button type="submit">Send</button>
                    </div>
                    <div class="compose-extra">
                        <button id="photoBtn" class="ghost" type="button">Photo</button>
                        <button id="voiceBtn" class="ghost" type="button">Voice</button>
                        <button id="videoBtn" class="ghost" type="button">Video</button>
                        <span id="videoLabel" class="voice-label" hidden></span>
                        <button id="videoClear" class="ghost" type="button" hidden>Remove</button>
                        <input id="videoInput" type="file" accept="video/*" hidden>
                        <img id="photoPreview" alt="" hidden>
                        <button id="photoClear" class="ghost" type="button" hidden>Remove</button>
                        <input id="photoInput" type="file" accept="image/*" hidden>
                        <div class="challenge-fields">
                            <input id="scoreInput" maxlength="20" placeholder="Score" autocomplete="off">
                            <input id="timeInput" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="Time" aria-label="Time">
                            <select id="timeUnit" aria-label="Minutes or hours">
                                <option value="mins">mins</option>
                                <option value="hours">hours</option>
                            </select>
                        </div>
                    </div>
                </form>
                <div id="voicePop" class="voice-pop" hidden>
                    <p class="voice-live">Recording</p>
                    <p id="voiceTime" class="voice-time">0:00</p>
                    <div class="voice-wave" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <div class="voice-actions">
                        <button id="voiceCancel" type="button">Cancel</button>
                        <button id="voiceStop" type="button">Stop</button>
                    </div>
                </div>
                <p id="chatError" class="error" role="alert"></p>
            </div>
        </dialog>
        <dialog id="groupPop">
            <div class="pop">
                <div class="pop-bar">
                    <p class="hint">New group</p>
                    <button id="closeGroup" class="quiet" type="button">Close</button>
                </div>
                <form id="groupForm" class="group-body">
                    <input id="groupName" maxlength="40" placeholder="Group name" autocomplete="off" required>
                    <div id="groupMembers"></div>
                    <div class="group-add">
                        <input id="groupUser" maxlength="20" placeholder="Username" autocomplete="off">
                        <button id="groupAdd" type="button">Add</button>
                    </div>
                    <p id="groupError" class="error" role="alert"></p>
                    <button type="submit">Create group</button>
                </form>
            </div>
        </dialog>
        <dialog id="notesAsk">
            <div class="notes-ask">
                <button id="seeNotes" type="button">See notes</button>
                <button id="cancelNotes" type="button">Cancel</button>
            </div>
        </dialog>
        <dialog id="notesPop">
            <div class="pop">
                <div class="pop-bar">
                    <p class="hint">Notes</p>
                    <button id="closeNotes" class="quiet" type="button">Close</button>
                </div>
                <div class="notes-body">
                    <textarea id="noteText" maxlength="5000" placeholder="Write a note"></textarea>
                    <div id="noteTable" hidden>
                        <div id="noteRows"></div>
                        <div class="note-total">
                            <span>Total</span>
                            <strong id="noteTotal">0</strong>
                        </div>
                        <button id="addNoteRow" type="button">Add a row</button>
                    </div>
                    <button id="toggleTable" class="ghost" type="button">Add a table</button>
                    <div id="takeTable" hidden>
                        <label class="note-start">
                            Starting number
                            <input id="noteStart" inputmode="decimal" maxlength="20" placeholder="0" autocomplete="off">
                        </label>
                        <div id="takeRows"></div>
                        <div class="note-total">
                            <span>Remaining</span>
                            <strong id="noteLeft">0</strong>
                        </div>
                        <button id="addTakeRow" type="button">Add a number</button>
                    </div>
                    <button id="toggleTake" class="ghost" type="button">Take away from a number</button>
                </div>
            </div>
        </dialog>
    </main>
    <script src="cash.js"></script>
    <script src="messenger.js"></script>
</body>
</html>
