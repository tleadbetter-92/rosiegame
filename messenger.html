<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="messenger.css">
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            if (!params.has("enter") && !params.has("chat")) location.replace("index.html");
        })();
    </script>
</head>
<body>
    <main class="app">
        <header class="top">
            <h1>Leaderboard</h1>
            <div class="who">
                <button id="notifyBtn" type="button" hidden>Notify me</button>
                <button id="logoutBtn" type="button" hidden>Log out</button>
            </div>
            <div class="under">
                <p class="hint">Challenges proposed</p>
                <p class="hint"><a href="index.html">Back to the game</a></p>
            </div>
        </header>
        <button id="seeAllBtn" type="button">See all challenges</button>

        <section id="auth">
            <form id="signupForm" class="card">
                <h2>Create an account</h2>
                <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="20"></label>
                <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
                <button type="submit">Sign up</button>
            </form>
            <form id="loginForm" class="card">
                <h2>Log in</h2>
                <label>Username<input name="username" autocomplete="username" required></label>
                <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
                <button type="submit">Log in</button>
            </form>
            <p id="authError" class="error" role="alert"></p>
        </section>

        <section id="chat" hidden>
            <p class="hint">Scores to beat</p>
            <ul id="contacts"></ul>
            <form id="addForm">
                <input id="contactInput" maxlength="20" placeholder="Username" autocomplete="off" tabindex="-1">
                <button type="submit">Add</button>
            </form>
            <p id="contactError" class="error" role="alert"></p>
        </section>
        <dialog id="chatPop">
            <div class="pop">
                <div class="pop-bar">
                    <p id="threadTitle" class="hint">Chat</p>
                    <button id="closePop" class="quiet" type="button">Close</button>
                </div>
                <ol id="messages"></ol>
                <form id="sendForm" hidden>
                    <input id="messageInput" maxlength="500" placeholder="Message (optional)" autocomplete="off">
                        <input id="scoreInput" maxlength="20" placeholder="Score" autocomplete="off">
                        <div class="time-field">
                            <input id="timeInput" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="Time" aria-label="Time">
                        <select id="timeUnit" aria-label="Minutes or hours">
                            <option value="mins">mins</option>
                            <option value="hours">hours</option>
                        </select>
                    </div>
                    <button type="submit">Send</button>
                </form>
                <p id="chatError" class="error" role="alert"></p>
            </div>
        </dialog>
    </main>
    <script src="messenger.js"></script>
</body>
</html>
