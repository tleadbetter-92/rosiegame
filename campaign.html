<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign</title>
    <link rel="stylesheet" href="campaign.css?v=dash">
</head>
<body class="play">
    <header>
        <nav>
            <a href="village.html">Village</a>
            <a href="village.html?fly=1">Survey</a>
            <button type="button" id="gfx-toggle" class="gfx-toggle">Graphics: Medium</button>
        </nav>
        <div>
            <p class="eyebrow">Campaign</p>
            <h1 id="when-who">Faction A's turn</h1>
        </div>
        <div class="play-when">
            <p id="when-day">Day 1</p>
            <p id="when-turn">Turn 1 of 2 · Morning</p>
        </div>
        <button id="end-turn" type="button">End turn</button>
    </header>
    <main class="play-main">
        <figure class="play-map">
            <canvas id="land" width="960" height="720" aria-label="Faction A and Faction B"></canvas>
        </figure>
        <aside class="play-side">
            <section class="turn-card" id="turn-help"></section>
            <h2>Lands</h2>
            <div id="regions"></div>
            <h2>Looking at</h2>
            <div id="settlement"><p class="quiet">Click a town, a capital, or an army.</p></div>
            <h2>What just happened</h2>
            <ul id="log"></ul>
        </aside>
    </main>
    <script src="gfx-settings.js"></script>
    <script src="world-edit.js"></script>
    <script src="world.js"></script>
    <script src="campaign-districts.js?v=1"></script>
    <script src="campaign-play.js?v=staff2"></script>
</body>
</html>
