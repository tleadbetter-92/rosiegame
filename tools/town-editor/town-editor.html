<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Town editor</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #87a8c4; font-family: "Segoe UI", system-ui, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        #bar {
            position: fixed; top: 12px; left: 12px; z-index: 2;
            background: rgba(20, 16, 12, 0.88); color: #f3ead8;
            padding: 12px; border-radius: 8px; width: 220px;
            max-height: calc(100% - 24px); overflow-y: auto;
        }
        #bar h1 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
        #bar p { font-size: 12px; line-height: 1.4; margin: 0 0 8px; color: #d9cbb4; }
        button, label.tool {
            display: block; width: 100%; box-sizing: border-box;
            margin: 4px 0; padding: 6px 8px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06);
            color: white; text-align: left; cursor: pointer; font: 600 13px "Segoe UI", sans-serif;
        }
        label.tool.on { background: #8a5a32; border-color: #f0d8b0; }
        #file { display: none; }
        #status { font-size: 12px; color: #f0d8b0; min-height: 1.2em; }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <div id="bar">
        <h1>Town block</h1>
        <p>The piece sits under the cursor. Left click sets it down. R turns it. Right-drag looks. WASD moves.</p>
        <label class="tool on"><input type="radio" name="tool" value="street" checked> Street house</label>
        <label class="tool"><input type="radio" name="tool" value="long"> Long house</label>
        <label class="tool"><input type="radio" name="tool" value="cot"> Cottage</label>
        <label class="tool"><input type="radio" name="tool" value="shop"> Shop</label>
        <label class="tool"><input type="radio" name="tool" value="gable"> Timber house</label>
        <label class="tool"><input type="radio" name="tool" value="lord"> Lord's house</label>
        <label class="tool"><input type="radio" name="tool" value="barracks"> Barracks</label>
        <label class="tool"><input type="radio" name="tool" value="smith"> Blacksmith</label>
        <label class="tool"><input type="radio" name="tool" value="vshop"> Village shop</label>
        <label class="tool"><input type="radio" name="tool" value="stores"> Storehouse</label>
        <label class="tool"><input type="radio" name="tool" value="inn"> Inn</label>
        <label class="tool"><input type="radio" name="tool" value="yard"> Lumber yard</label>
        <label class="tool"><input type="radio" name="tool" value="cobble"> Cobbles</label>
        <label class="tool"><input type="radio" name="tool" value="stone"> Stone floor</label>
        <label class="tool"><input type="radio" name="tool" value="gravel"> Gravel</label>
        <label class="tool"><input type="radio" name="tool" value="grass"> Grass</label>
        <label class="tool"><input type="radio" name="tool" value="fence"> Fence</label>
        <label class="tool"><input type="radio" name="tool" value="erase"> Erase</label>
        <button type="button" id="save">Save in this browser</button>
        <button type="button" id="export">Download block</button>
        <button type="button" id="load">Load block</button>
        <input id="file" type="file" accept="application/json,.json">
        <p id="status"></p>
    </div>
    <script>
        const canvas = document.getElementById("view");
        const gl = canvas.getContext("webgl", { antialias: true });
        const CELL = 2;
        const HALF = 96;
        const storeKey = "town-block";

        const block = { ground: {}, buildings: [], fences: [] };
        let tool = "street";
        let yaw = 0;
        let camYaw = 0.6;
        let camPitch = 0.55;
        let camDist = 42;
        const target = { x: 0, z: 0 };
        let painting = false;

        function tex(paint, repeat) {
            const c = document.createElement("canvas");
            c.width = 128; c.height = 128;
            paint(c.getContext("2d"), 128);
            const t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
            return t;
        }
        function pane(g, x, y, w, h) {
            g.fillStyle = "#1a2830";
            g.fillRect(x, y, w, h);
            g.fillStyle = "#d5e2ea";
            g.fillRect(x + 2, y + 2, w * 0.35, h * 0.3);
            g.fillStyle = "#cbb892";
            g.fillRect(x + w * 0.46, y, 2, h);
            g.fillRect(x, y + h * 0.46, w, 2);
        }
        const textures = {
            stone: tex((g, s) => {
                g.fillStyle = "#c4a36a"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#8a6a40";
                for (let y = 4; y < s; y += 16) {
                    g.fillRect(0, y, s, 3);
                    const shift = (y / 16) % 2 ? 14 : 0;
                    for (let x = shift; x < s; x += 28) g.fillRect(x, y - 12, 2, 12);
                }
            }),
            timber: tex((g, s) => {
                g.fillStyle = "#d9c4a0"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#2e2418";
                g.fillRect(0, 0, s, 8); g.fillRect(0, 60, s, 8); g.fillRect(0, s - 8, s, 8);
                g.fillRect(0, 0, 8, s); g.fillRect(40, 0, 8, s); g.fillRect(80, 0, 8, s); g.fillRect(s - 8, 0, 8, s);
                pane(g, 14, 78, 20, 28); pane(g, 54, 78, 20, 28); pane(g, 94, 78, 20, 28);
                pane(g, 14, 18, 20, 28); pane(g, 54, 18, 20, 28); pane(g, 94, 18, 20, 28);
            }),
            roof: tex((g, s) => {
                g.fillStyle = "#5c3428"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#3e2218";
                for (let y = 0; y < s; y += 10) g.fillRect(0, y, s, 3);
            }, true),
            red: tex((g, s) => {
                g.fillStyle = "#7a4030"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#c4a070";
                for (let i = 0; i < 80; i++) g.fillRect((i * 13) % s, (i * 19) % s, 3, 2);
                g.fillStyle = "#3a2418";
                g.fillRect(0, 0, s, 10);
                g.fillRect(0, 58, s, 9);
                g.fillRect(0, s - 12, s, 12);
                for (let x = 0; x < s; x += 32) g.fillRect(x, 0, 7, s);
                g.fillRect(s - 7, 0, 7, s);
                for (let x = 12; x < s - 8; x += 32) pane(g, x, 72, 14, 26);
            }, true),
            keep: tex((g, s) => {
                g.fillStyle = "#d8c4a4"; g.fillRect(0, 0, s, s);
                g.fillStyle = "rgba(90,70,40,0.18)";
                for (let i = 0; i < 40; i++) g.fillRect((i * 17) % s, (i * 29) % s, 3, 2);
                g.fillStyle = "#5c3b24";
                g.fillRect(0, 0, s, 8); g.fillRect(0, s - 8, s, 8);
            }, true),
            linen: tex((g, s) => {
                g.fillStyle = "#8d3d3a"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#c4b49a"; g.fillRect(0, 0, s, 16);
                g.fillStyle = "#6e2e2c";
                for (let y = 20; y < s; y += 12) g.fillRect(0, y, s, 3);
            }),
            glow: tex((g, s) => {
                g.fillStyle = "#e8a040"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#fff0b0"; g.fillRect(36, 16, 40, 70);
            }),
            plaster: tex((g, s) => {
                g.fillStyle = "#c4a574"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#a88858";
                for (let y = 0; y < s; y += 16) g.fillRect(0, y, s, 2);
                g.fillStyle = "#6a5438";
                g.fillRect(0, 0, s, 8); g.fillRect(0, s - 10, s, 10);
                g.fillStyle = "#1e3340";
                g.fillRect(26, 68, 22, 30); g.fillRect(80, 68, 22, 30);
                g.fillStyle = "#d5e2ea";
                g.fillRect(28, 70, 8, 12); g.fillRect(82, 70, 8, 12);
            }),
            shop: tex((g, s) => {
                g.fillStyle = "#6a3e28"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#4a2c1c";
                for (let x = 0; x < s; x += 16) g.fillRect(x, 0, 2, s);
                g.fillStyle = "#2a241c";
                g.fillRect(0, 0, s, 10); g.fillRect(0, s - 12, s, 12);
                g.fillStyle = "#2c5878";
                for (let x = 10; x < s - 8; x += 28) g.fillRect(x, 46, 16, 38);
                g.fillStyle = "#9ec4d8";
                for (let x = 12; x < s - 8; x += 28) g.fillRect(x, 50, 5, 12);
            }, true),
            thatch: tex((g, s) => {
                g.fillStyle = "#b08a48"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#8a6830";
                for (let y = 0; y < s; y += 6) g.fillRect(0, y, s, 2);
                g.fillStyle = "#d8bc78";
                for (let y = 2; y < s; y += 6) {
                    for (let x = (y % 12); x < s; x += 5) g.fillRect(x, y, 2, 2);
                }
            }, true),
            grass: tex((g, s) => { g.fillStyle = "#4d7a3c"; g.fillRect(0, 0, s, s); }, true),
            field: tex((g, s) => { g.fillStyle = "#3a6234"; g.fillRect(0, 0, s, s); }, true),
            cobble: tex((g, s) => {
                g.fillStyle = "#5a564e"; g.fillRect(0, 0, s, s);
                const tones = ["#8a847c", "#6e6a64", "#9a948c"];
                let y = 2, row = 0;
                while (y < s) {
                    let x = (row % 2) * 8;
                    while (x < s) { g.fillStyle = tones[(row + x) % 3]; g.fillRect(x, y, 10, 6); x += 12; }
                    y += 8; row++;
                }
            }, true),
            gravel: tex((g, s) => {
                g.fillStyle = "#6a6560"; g.fillRect(0, 0, s, s);
                g.fillStyle = "#4a4642";
                for (let i = 0; i < 40; i++) g.fillRect((i * 17) % s, (i * 29) % s, 4, 3);
            }, true),
            stone: tex((g, s) => {
                g.fillStyle = "#9ea1ab"; g.fillRect(0, 0, s, s);
                const tones = ["#b4b7c0", "#8e929c", "#a8acb6", "#7e848e"];
                let y = 2, row = 0;
                while (y < s - 2) {
                    let x = (row % 2) * 18;
                    let col = 0;
                    while (x < s) {
                        g.fillStyle = tones[(row + col) % tones.length];
                        g.fillRect(x, y, 22, 14);
                        x += 24; col++;
                    }
                    y += 16; row++;
                }
                g.fillStyle = "#5c616a";
                for (let y = 0; y < s; y += 16) g.fillRect(0, y, s, 1);
            }, true),
            mark: tex((g, s) => { g.fillStyle = "#f2d48a"; g.fillRect(0, 0, s, s); }),
            wood: tex((g, s) => { g.fillStyle = "#6a4324"; g.fillRect(0, 0, s, s); g.fillStyle = "#3e2614"; g.fillRect(0, 0, 4, s); })
        };

        const vs = `
            attribute vec3 aPos; attribute vec2 aUv; attribute float aShade;
            uniform mat4 uView, uProj;
            varying vec2 vUv; varying float vShade;
            void main() { vUv = aUv; vShade = aShade; gl_Position = uProj * uView * vec4(aPos, 1.0); }
        `;
        const fs = `
            precision mediump float;
            varying vec2 vUv; varying float vShade; uniform sampler2D uTex;
            void main() { gl_FragColor = vec4(texture2D(uTex, vUv).rgb * vShade, 1.0); }
        `;
        function compile(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s); return s;
        }
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
        gl.bindAttribLocation(program, 0, "aPos");
        gl.linkProgram(program);
        const loc = {
            pos: 0,
            uv: gl.getAttribLocation(program, "aUv"),
            shade: gl.getAttribLocation(program, "aShade"),
            view: gl.getUniformLocation(program, "uView"),
            proj: gl.getUniformLocation(program, "uProj"),
            tex: gl.getUniformLocation(program, "uTex")
        };

        function pushQuad(list, a, b, c, d) { list.push(...a, ...b, ...c, ...a, ...c, ...d); }
        function pushTri(list, a, b, c) { list.push(...a, ...b, ...c); }

        function streetMesh() {
            const stone = [], timber = [], roof = [];
            const x0 = -4, x1 = 4, z0 = -3.5, z1 = 3.5;
            const stoneH = 2.7, wall = 6.1, peak = 9.3;
            const front = (yLo, yHi, list) => pushQuad(list,
                [x1, yLo, z1, 1, 0, 1], [x1, yHi, z1, 1, 1, 1], [x0, yHi, z1, 0, 1, 1], [x0, yLo, z1, 0, 0, 1]);
            const back = (yLo, yHi, list) => pushQuad(list,
                [x0, yLo, z0, 1, 0, 0.82], [x0, yHi, z0, 1, 1, 0.82], [x1, yHi, z0, 0, 1, 0.82], [x1, yLo, z0, 0, 0, 0.82]);
            front(0, stoneH, stone); front(stoneH, wall, timber);
            back(0, stoneH, stone); back(stoneH, wall, timber);
            pushQuad(stone, [x1, 0, z0, 0, 0, 0.78], [x1, stoneH, z0, 0, 1, 0.78], [x1, stoneH, z1, 1, 1, 0.78], [x1, 0, z1, 1, 0, 0.78]);
            pushQuad(timber, [x1, stoneH, z0, 0, 0, 0.78], [x1, wall, z0, 0, 1, 0.78], [x1, wall, z1, 1, 1, 0.78], [x1, stoneH, z1, 1, 0, 0.78]);
            pushQuad(stone, [x0, 0, z1, 0, 0, 0.9], [x0, stoneH, z1, 0, 1, 0.9], [x0, stoneH, z0, 1, 1, 0.9], [x0, 0, z0, 1, 0, 0.9]);
            pushQuad(timber, [x0, stoneH, z1, 0, 0, 0.9], [x0, wall, z1, 0, 1, 0.9], [x0, wall, z0, 1, 1, 0.9], [x0, stoneH, z0, 1, 0, 0.9]);
            pushTri(timber, [x1, wall, z1, 1, 0, 1], [0, peak, z1, 0.5, 1, 1], [x0, wall, z1, 0, 0, 1]);
            pushTri(timber, [x0, wall, z0, 1, 0, 0.82], [0, peak, z0, 0.5, 1, 0.82], [x1, wall, z0, 0, 0, 0.82]);
            const o = 0.45;
            pushQuad(roof, [x1 + o, wall, z0 - o, 0, 0, 0.95], [0, peak, z0 - o, 0, 1, 1], [0, peak, z1 + o, 3, 1, 1], [x1 + o, wall, z1 + o, 3, 0, 0.95]);
            pushQuad(roof, [x0 - o, wall, z1 + o, 0, 0, 0.78], [0, peak, z1 + o, 0, 1, 0.9], [0, peak, z0 - o, 3, 1, 0.9], [x0 - o, wall, z0 - o, 3, 0, 0.78]);
            return { stone, timber, roof };
        }
        function longMesh() {
            const red = [], thatch = [];
            const x0 = -4, x1 = 4, z0 = -9, z1 = 9;
            const wall = 3.2, peak = 7.4;
            pushQuad(red, [x1, 0, z0, 0, 0, 1], [x1, wall, z0, 0, 1, 1], [x1, wall, z1, 5, 1, 1], [x1, 0, z1, 5, 0, 1]);
            pushQuad(red, [x0, 0, z1, 0, 0, 0.82], [x0, wall, z1, 0, 1, 0.82], [x0, wall, z0, 5, 1, 0.82], [x0, 0, z0, 5, 0, 0.82]);
            pushQuad(red, [x1, 0, z1, 1, 0, 0.9], [x1, wall, z1, 1, 0.55, 0.9], [x0, wall, z1, 0, 0.55, 0.9], [x0, 0, z1, 0, 0, 0.9]);
            pushQuad(red, [x0, 0, z0, 1, 0, 0.86], [x0, wall, z0, 1, 0.55, 0.86], [x1, wall, z0, 0, 0.55, 0.86], [x1, 0, z0, 0, 0, 0.86]);
            pushTri(red, [x1, wall, z1, 1, 0.55, 0.9], [0, peak, z1, 0.5, 1, 0.9], [x0, wall, z1, 0, 0.55, 0.9]);
            pushTri(red, [x0, wall, z0, 1, 0.55, 0.86], [0, peak, z0, 0.5, 1, 0.86], [x1, wall, z0, 0, 0.55, 0.86]);
            const o = 0.55;
            pushQuad(thatch, [x0 - o, wall, z1 + o, 0, 0, 0.95], [0, peak, z1 + o, 0, 1, 1], [0, peak, z0 - o, 4, 1, 1], [x0 - o, wall, z0 - o, 4, 0, 0.95]);
            pushQuad(thatch, [x1 + o, wall, z0 - o, 0, 0, 0.8], [0, peak, z0 - o, 0, 1, 0.9], [0, peak, z1 + o, 4, 1, 0.9], [x1 + o, wall, z1 + o, 4, 0, 0.8]);
            return { red, thatch };
        }
        function gableMesh(x0, x1, z0, z1, wall, peak, o) {
            const walls = [], roof = [];
            pushQuad(walls, [x1, 0, z1, 1, 0, 1], [x1, wall, z1, 1, 1, 1], [x0, wall, z1, 0, 1, 1], [x0, 0, z1, 0, 0, 1]);
            pushTri(walls, [x1, wall, z1, 1, 0, 1], [0, peak, z1, 0.5, 1, 1], [x0, wall, z1, 0, 0, 1]);
            pushQuad(walls, [x0, 0, z0, 1, 0, 0.82], [x0, wall, z0, 1, 1, 0.82], [x1, wall, z0, 0, 1, 0.82], [x1, 0, z0, 0, 0, 0.82]);
            pushTri(walls, [x0, wall, z0, 1, 0, 0.82], [0, peak, z0, 0.5, 1, 0.82], [x1, wall, z0, 0, 0, 0.82]);
            pushQuad(walls, [x1, 0, z0, 0, 0, 0.78], [x1, wall, z0, 0, 1, 0.78], [x1, wall, z1, 1, 1, 0.78], [x1, 0, z1, 1, 0, 0.78]);
            pushQuad(walls, [x0, 0, z1, 0, 0, 0.9], [x0, wall, z1, 0, 1, 0.9], [x0, wall, z0, 1, 1, 0.9], [x0, 0, z0, 1, 0, 0.9]);
            pushQuad(roof, [x1 + o, wall, z0 - o, 0, 0, 0.95], [0, peak, z0 - o, 0, 1, 1], [0, peak, z1 + o, 2, 1, 1], [x1 + o, wall, z1 + o, 2, 0, 0.95]);
            pushQuad(roof, [x0 - o, wall, z1 + o, 0, 0, 0.78], [0, peak, z1 + o, 0, 1, 0.9], [0, peak, z0 - o, 2, 1, 0.9], [x0 - o, wall, z0 - o, 2, 0, 0.78]);
            return { walls, roof };
        }
        function shopMesh() {
            const walls = [], roof = [];
            const x0 = -3, x1 = 3, z0 = -8, z1 = 8, h = 3.2, o = 0.25;
            pushQuad(walls, [x1, 0, z0, 0, 0, 1], [x1, h, z0, 0, 1, 1], [x1, h, z1, 4, 1, 1], [x1, 0, z1, 4, 0, 1]);
            pushQuad(walls, [x0, 0, z1, 0, 0, 0.82], [x0, h, z1, 0, 1, 0.82], [x0, h, z0, 4, 1, 0.82], [x0, 0, z0, 4, 0, 0.82]);
            pushQuad(walls, [x0, 0, z0, 0, 0, 0.9], [x0, h, z0, 0, 1, 0.9], [x1, h, z0, 1, 1, 0.9], [x1, 0, z0, 1, 0, 0.9]);
            pushQuad(walls, [x1, 0, z1, 0, 0, 0.86], [x1, h, z1, 0, 1, 0.86], [x0, h, z1, 1, 1, 0.86], [x0, 0, z1, 1, 0, 0.86]);
            const y = h + 0.08;
            pushQuad(roof, [x0 - o, y, z0 - o, 0, 0, 0.72], [x1 + o, y, z0 - o, 2, 0, 0.72], [x1 + o, y, z1 + o, 2, 3, 0.72], [x0 - o, y, z1 + o, 0, 3, 0.72]);
            pushQuad(roof, [x0 - o, y, z1 + o, 0, 3, 0.55], [x1 + o, y, z1 + o, 2, 3, 0.55], [x1 + o, y, z0 - o, 2, 0, 0.55], [x0 - o, y, z0 - o, 0, 0, 0.55]);
            return { walls, roof };
        }
        function paletteTex(colors) {
            const c = document.createElement("canvas");
            c.width = Math.max(1, colors.length);
            c.height = 1;
            const g = c.getContext("2d");
            colors.forEach((rgb, i) => {
                g.fillStyle = "rgb(" + rgb.join(",") + ")";
                g.fillRect(i, 0, 1, 1);
            });
            const t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            return t;
        }
        // The lumber yard already converted from the first Roblox yard: boxes and cylinders, one mesh.
        function yardFromModel(model) {
            const list = [];
            const n = Math.max(1, model.palette.length);
            const put = (x, y, z, shade, color) => [x, y, z, (color + 0.5) / n, 0.5, shade];
            for (const part of model.parts) {
                const sx = part[1], sy = part[2], sz = part[3];
                const px = part[4], py = part[5], pz = part[6];
                const r = part.slice(7, 16);
                const color = part[16] || 0;
                const xf = (lx, ly, lz) => put(
                    px + lx * r[0] + ly * r[1] + lz * r[2],
                    py + lx * r[3] + ly * r[4] + lz * r[5],
                    pz + lx * r[6] + ly * r[7] + lz * r[8],
                    1, color
                );

                x: a.xx * vx + a.yx * vy - a.zx,
                y: a.yy * vy - a.zy,
                z: a.xz * vx + a.yz * vy - a.zz
            };
            if (dir.y >= -0.0001) return null;
            const t = -e.y / dir.y;
            if (t < 0) return null;
            return { x: e.x + dir.x * t, z: e.z + dir.z * t };
        }
        function paintAt(p) {
            if (!p) return;
            const x = snap(p.x), z = snap(p.z);
            if (x < -HALF || x >= HALF || z < -HALF || z >= HALF) return;
            if (tool === "grass" || tool === "cobble" || tool === "gravel" || tool === "stone") {
                block.ground[x + "," + z] = tool;
            } else if (tool === "erase") {
                delete block.ground[x + "," + z];
                block.buildings = block.buildings.filter((b) => Math.hypot(b.x - p.x, b.z - p.z) > 3);
                block.fences = block.fences.filter((f) => Math.hypot(f.x - p.x, f.z - p.z) > 2);
            } else if (tool === "street" || tool === "long" || tool === "yard" || tool === "cot" || tool === "shop" || tool === "gable" || civicTools.indexOf(tool) >= 0) {
                block.buildings.push({ t: tool, x: x, z: z, yaw: yaw });
            } else if (tool === "fence") {
                block.fences.push({ x: x, z: z, yaw: yaw });
            }
            rebuild();
        }

        function cameraAxes(e) {
            let zx = e.x - target.x, zy = e.y, zz = e.z - target.z;
            let len = Math.hypot(zx, zy, zz) || 1;
            zx /= len; zy /= len; zz /= len;
            let xx = zz, xz = -zx;
            len = Math.hypot(xx, xz) || 1;
            xx /= len; xz /= len;
            return {
                xx, xz,
                yx: zy * xz,
                yy: zz * xx - zx * xz,
                yz: -zy * xx,
                zx, zy, zz
            };
        }
        function lookAt(e) {
            const a = cameraAxes(e);
            return new Float32Array([
                a.xx, a.yx, a.zx, 0,
                0, a.yy, a.zy, 0,
                a.xz, a.yz, a.zz, 0,
                -(a.xx * e.x + a.xz * e.z), -(a.yx * e.x + a.yy * e.y + a.yz * e.z), -(a.zx * e.x + a.zy * e.y + a.zz * e.z), 1
            ]);
        }
        function perspective() {
            const f = 1 / Math.tan(0.45);
            const aspect = canvas.width / Math.max(1, canvas.height);
            const near = 0.1, far = 800, nf = 1 / (near - far);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, 2 * far * near * nf, 0
            ]);
        }
        function draw() {
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            canvas.width = Math.floor(canvas.clientWidth * dpr);
            canvas.height = Math.floor(canvas.clientHeight * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.62, 0.76, 0.88, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.CULL_FACE);
            gl.useProgram(program);
            gl.uniformMatrix4fv(loc.view, false, lookAt(eye()));
            gl.uniformMatrix4fv(loc.proj, false, perspective());
            const order = ["field", "grass", "cobble", "gravel", "stone", "timber", "plaster", "shop", "keep", "red", "roof", "thatch", "wood", "linen", "glow", "yard", "mark"];
            for (const name of order) {
                const mesh = meshes[name];
                if (!mesh || !mesh.count || !textures[name]) continue;
                gl.bindBuffer(gl.ARRAY_BUFFER, mesh);
                gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, 24, 0);
                gl.enableVertexAttribArray(loc.pos);
                gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 24, 12);
                gl.enableVertexAttribArray(loc.uv);
                gl.vertexAttribPointer(loc.shade, 1, gl.FLOAT, false, 24, 20);
                gl.enableVertexAttribArray(loc.shade);
                gl.bindTexture(gl.TEXTURE_2D, textures[name]);
                if (name === "yard") gl.disable(gl.CULL_FACE);
                gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
                if (name === "yard") gl.enable(gl.CULL_FACE);
            }
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.depthFunc(gl.LEQUAL);
            for (const name of order) {
                const mesh = ghost[name];
                if (!mesh || !mesh.count || !textures[name]) continue;
                gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buffer);
                gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, 24, 0);
                gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 24, 12);
                gl.vertexAttribPointer(loc.shade, 1, gl.FLOAT, false, 24, 20);
                gl.bindTexture(gl.TEXTURE_2D, textures[name]);
                if (name === "yard") gl.disable(gl.CULL_FACE);
                gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
                if (name === "yard") gl.enable(gl.CULL_FACE);
            }
            gl.depthFunc(gl.LESS);
            gl.disable(gl.BLEND);
            requestAnimationFrame(draw);
        }

        document.querySelectorAll("input[name=tool]").forEach((input) => {
            input.addEventListener("change", () => {
                tool = input.value;
                document.querySelectorAll("label.tool").forEach((el) => el.classList.toggle("on", el.contains(input) && input.checked));
            });
        });
        canvas.addEventListener("mousedown", (e) => {
            if (e.button === 2) { painting = false; return; }
            painting = true;
            paintAt(hit(e.clientX, e.clientY));
        });
        canvas.addEventListener("mousemove", (e) => {
            if (e.buttons === 2) {
                camYaw += e.movementX * 0.008;
                camPitch = Math.max(0.15, Math.min(1.2, camPitch + e.movementY * 0.006));
                return;
            }
            hover = hit(e.clientX, e.clientY);
            rebuildGhost();
            if (painting && (tool === "grass" || tool === "cobble" || tool === "gravel" || tool === "stone" || tool === "erase")) {
                paintAt(hover);
            }
            const status = document.getElementById("status");
            if (hover) status.textContent = Math.round(hover.x) + ", " + Math.round(hover.z);
        });
        window.addEventListener("mouseup", () => { painting = false; });
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        canvas.addEventListener("wheel", (e) => {
            camDist = Math.max(12, Math.min(240, camDist + Math.sign(e.deltaY) * 4));
            e.preventDefault();
        }, { passive: false });
        window.addEventListener("keydown", (e) => {
            if (e.code === "KeyR") {
                yaw = (yaw + Math.PI / 2) % (Math.PI * 2);
                rebuildGhost();
            }
            const step = e.shiftKey ? 6 : 2;
            const cam = eye();
            let fx = target.x - cam.x, fz = target.z - cam.z;
            const fl = Math.hypot(fx, fz) || 1;
            fx /= fl; fz /= fl;
            if (e.code === "KeyW") { target.x += fx * step; target.z += fz * step; }
            if (e.code === "KeyS") { target.x -= fx * step; target.z -= fz * step; }
            if (e.code === "KeyD") { target.x += fz * step; target.z -= fx * step; }
            if (e.code === "KeyA") { target.x -= fz * step; target.z += fx * step; }
        });

        function payload() {
            const ground = Object.entries(block.ground).map(([key, t]) => {
                const [x, z] = key.split(",").map(Number);
                return { x, z, t };
            });
            return { kind: "town-block", size: HALF * 2, ground, buildings: block.buildings, fences: block.fences };
        }
        function applyPayload(data) {
            block.ground = {};
            for (const cell of data.ground || []) block.ground[cell.x + "," + cell.z] = cell.t;
            block.buildings = data.buildings || [];
            block.fences = data.fences || [];
            rebuild();
        }
        document.getElementById("save").addEventListener("click", () => {
            localStorage.setItem(storeKey, JSON.stringify(payload()));
            document.getElementById("status").textContent = "Saved in this browser.";
        });
        document.getElementById("export").addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(payload(), null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "town-block.json";
            a.click();
            document.getElementById("status").textContent = "Downloaded town-block.json.";
        });
        document.getElementById("load").addEventListener("click", () => document.getElementById("file").click());
        document.getElementById("file").addEventListener("change", () => {
            const file = document.getElementById("file").files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                applyPayload(JSON.parse(reader.result));
                document.getElementById("status").textContent = "Loaded " + file.name + ".";
            };
            reader.readAsText(file);
        });

        const saved = localStorage.getItem(storeKey);
        if (saved) {
            try { applyPayload(JSON.parse(saved)); } catch (err) { sampleLayout(); rebuild(); }
        } else {
            sampleLayout();
            rebuild();
        }
        fetch("/models/roblox/lumberyard.json").then((res) => res.json()).then(yardFromModel).catch(() => {
            document.getElementById("status").textContent = "Lumber yard model did not load.";
        });
        requestAnimationFrame(draw);
    </script>
</body>
</html>
